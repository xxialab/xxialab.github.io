<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | CSLM Lab</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="theme-color" content="#f6f8f7">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" hreflang="{{ page.alt_lang }}" href="{{ page.alternate | absolute_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ page.x_default | absolute_url }}">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css?v=20260829-1' | relative_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CSLM Lab">
  <meta property="og:title" content="{{ page.title }} | CSLM Lab">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/og-image.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  {% if page.lang == 'zh-Hans' %}<meta property="og:locale" content="zh_CN">{% else %}<meta property="og:locale" content="en_US">{% endif %}
</head>
<body>
  <a class="skip-link" href="#main-content">{% if page.lang == 'zh-Hans' %}跳到正文{% else %}Skip to content{% endif %}</a>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}
  <script defer src="{{ '/assets/site.js?v=20260828-1' | relative_url }}"></script>
  {% include analytics.html %}
</body>
</html>
